<!-- =========================================================================
     WIDGET PUBLIKASI DOSEN DTNTF
     Tempel ke Elementor > widget "HTML", di BAWAH bagian profil yang
     kamu desain sendiri.

       data-base   : URL folder data di GitHub Pages
       data-slug   : slug dosen untuk halaman ini
       data-tampil : bagian yang ditampilkan, dipisah koma.
                     pilihan: skor, metrik, publikasi

     Konsep: statistik ditampilkan lengkap (datang dari tabel metrik SINTA,
     jadi akurat untuk seluruh karier), sedangkan daftar publikasi hanya
     10 terbaru per kategori — itu batas yang SINTA berikan tanpa login.
     Tidak ada pencarian atau filter, karena menyaring 10 entri tidak ada
     gunanya dan hanya membuat halaman terasa lebih lengkap dari kenyataan.

     Warna & font: Brand Guideline DTNTF 2026.
     ========================================================================= -->

<div class="dtntf-pub"
     data-base="https://NAMA-AKUN.github.io/dtntf-profil/data"
     data-slug="faridah"
     data-tampil="skor,metrik,publikasi">
  <div class="dp-loading">Memuat data publikasi…</div>
</div>

<style>
.dtntf-pub{
  --dp-navy:#073C64; --dp-navy-2:#1A2C43; --dp-ink:#0B0B16;
  --dp-ink-2:#4a5264; --dp-ink-3:#858c9c;
  --dp-surface:#fff; --dp-surface-2:#F7F7FB; --dp-line:#e3e4ec;
  --dp-lime:#C8E86D; --dp-navy-soft:#e8eef4;
  --dp-scholar:#3a6b45;
  --dp-radius:10px;
  font-family:'Plus Jakarta Sans','Jakarta Sans',inherit,system-ui,sans-serif;
  color:var(--dp-ink); line-height:1.55; max-width:1080px; margin:0 auto;
}
.dtntf-pub *{box-sizing:border-box}
.dtntf-pub .dp-loading,.dtntf-pub .dp-error{padding:26px;text-align:center;color:var(--dp-ink-2);
  background:var(--dp-surface-2);border-radius:var(--dp-radius)}
.dtntf-pub .dp-error{color:#8a2b2b;background:#fdf1f1}

.dtntf-pub .dp-judul{font-size:.76rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dp-navy-2);margin:0 0 15px;padding-bottom:9px;position:relative;
  border-bottom:1px solid var(--dp-line)}
.dtntf-pub .dp-judul::after{content:"";position:absolute;left:0;bottom:-1px;width:44px;height:3px;
  background:var(--dp-lime)}
.dtntf-pub .dp-blok{margin-bottom:36px}
.dtntf-pub .dp-blok:last-child{margin-bottom:0}

/* ---- skor SINTA ---- */
.dtntf-pub .dp-skor{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px}
.dtntf-pub .dp-skor-item{background:var(--dp-surface-2);border-radius:var(--dp-radius);padding:16px 18px}
.dtntf-pub .dp-skor-item.utama{background:var(--dp-navy);color:#fff}
.dtntf-pub .dp-skor-angka{font-size:1.9rem;font-weight:700;line-height:1.1;
  font-variant-numeric:tabular-nums;color:var(--dp-navy)}
.dtntf-pub .dp-skor-item.utama .dp-skor-angka{color:#fff}
.dtntf-pub .dp-skor-label{font-size:.78rem;color:var(--dp-ink-2);margin-top:4px;font-weight:500}
.dtntf-pub .dp-skor-item.utama .dp-skor-label{color:rgba(255,255,255,.82)}

/* ---- tabel metrik dengan bar ---- */
.dtntf-pub .dp-legenda{display:flex;gap:18px;flex-wrap:wrap;font-size:.79rem;
  color:var(--dp-ink-2);margin-bottom:14px}
.dtntf-pub .dp-legenda span{display:inline-flex;align-items:center;gap:6px}
.dtntf-pub .dp-dot{width:10px;height:10px;border-radius:2px;display:inline-block}
.dtntf-pub .dp-dot-scopus{background:var(--dp-navy)}
.dtntf-pub .dp-dot-scholar{background:var(--dp-scholar)}
.dtntf-pub .dp-dot-wos{background:var(--dp-ink-3)}

.dtntf-pub .dp-metrik{display:flex;flex-direction:column;gap:16px}
.dtntf-pub .dp-baris-nama{font-size:.84rem;font-weight:600;color:var(--dp-navy-2);margin-bottom:6px}
.dtntf-pub .dp-bar-baris{display:grid;grid-template-columns:78px 1fr 62px;gap:10px;
  align-items:center;font-size:.78rem;margin-bottom:4px}
.dtntf-pub .dp-bar-sumber{color:var(--dp-ink-2)}
.dtntf-pub .dp-bar-jalur{display:block;background:var(--dp-surface-2);border-radius:4px;height:9px;overflow:hidden}
.dtntf-pub .dp-bar-isi{display:block;height:100%;border-radius:4px;min-width:3px}
.dtntf-pub .dp-bar-nilai{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;
  color:var(--dp-ink)}

/* ---- daftar publikasi ---- */
.dtntf-pub .dp-kat{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  flex-wrap:wrap;margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--dp-line)}
.dtntf-pub .dp-kat:first-of-type{margin-top:0}
.dtntf-pub .dp-kat-nama{font-size:.95rem;font-weight:700;color:var(--dp-navy-2)}
.dtntf-pub .dp-kat-n{font-size:.75rem;color:var(--dp-ink-3)}
.dtntf-pub .dp-pub{padding:11px 0;border-bottom:1px solid var(--dp-line)}
.dtntf-pub .dp-pub:last-child{border-bottom:0}
.dtntf-pub .dp-pub-judul{font-weight:600;font-size:.93rem;margin:0 0 4px;line-height:1.42}
.dtntf-pub .dp-pub-judul a{color:var(--dp-ink);text-decoration:none}
.dtntf-pub .dp-pub-judul a:hover{color:var(--dp-navy);text-decoration:underline}
.dtntf-pub .dp-pub-meta{font-size:.77rem;color:var(--dp-ink-3);display:flex;gap:9px;
  flex-wrap:wrap;align-items:center}
.dtntf-pub .dp-tag{background:var(--dp-surface-2);border-radius:4px;padding:1px 7px}
.dtntf-pub .dp-tag-q{background:var(--dp-navy-soft);color:var(--dp-navy);font-weight:600}
.dtntf-pub .dp-tag-alt{background:#f1f6e2;color:#4a6115;font-weight:600}

.dtntf-pub .dp-catatan{font-size:.78rem;color:var(--dp-ink-2);background:var(--dp-surface-2);
  border-left:3px solid var(--dp-lime);border-radius:0 8px 8px 0;padding:10px 14px;margin-top:20px}
.dtntf-pub .dp-catatan a{color:var(--dp-navy)}
.dtntf-pub .dp-kaki{font-size:.73rem;color:var(--dp-ink-3);margin-top:20px;
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dtntf-pub .dp-kaki a{color:var(--dp-navy);text-decoration:none}
.dtntf-pub .dp-kaki a:hover{text-decoration:underline}

@media (max-width:560px){
  .dtntf-pub .dp-skor{grid-template-columns:repeat(2,1fr);gap:9px}
  .dtntf-pub .dp-skor-item{padding:13px 14px}
  .dtntf-pub .dp-skor-angka{font-size:1.5rem}
  .dtntf-pub .dp-bar-baris{grid-template-columns:66px 1fr 54px;font-size:.74rem}
}
</style>

<script>
(function () {
  var akar = document.currentScript.parentNode.querySelector('.dtntf-pub')
          || document.querySelector('.dtntf-pub:not([data-dp-siap])');
  if (!akar || akar.dataset.dpSiap) return;
  akar.dataset.dpSiap = '1';

  var BASE = (akar.dataset.base || '').replace(/\/$/, '');
  var SLUG = akar.dataset.slug || '';
  var TAMPIL = (akar.dataset.tampil || 'skor,metrik,publikasi')
                 .split(',').map(function (s) { return s.trim(); });
  var mau = function (n) { return TAMPIL.indexOf(n) > -1; };

  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var num = function (n) { return (n == null) ? '–' : Number(n).toLocaleString('id-ID'); };

  var NAMA_KATEGORI = {
    scopus: 'Publikasi terindeks Scopus',
    garuda: 'Publikasi jurnal nasional (Garuda)',
    ilmiah: 'Publikasi ilmiah lainnya',
    buku: 'Buku',
    paten: 'Paten & Hak Kekayaan Intelektual',
    penelitian: 'Penelitian',
    ppm: 'Pengabdian kepada Masyarakat'
  };
  var URUT = ['scopus', 'garuda', 'ilmiah', 'buku', 'paten', 'penelitian', 'ppm'];

  // Baris tabel metrik. Tiap baris punya skalanya sendiri — membandingkan
  // 421 artikel dengan 2.334 sitasi dalam satu skala tidak ada artinya.
  var BARIS = [
    ['artikel', 'Artikel'],
    ['sitasi', 'Sitasi'],
    ['dokumen_disitasi', 'Dokumen disitasi'],
    ['hindex', 'H-Index'],
    ['i10index', 'i10-Index'],
    ['gindex', 'G-Index']
  ];
  var SUMBER = [
    ['scopus', 'Scopus', 'dp-dot-scopus', 'var(--dp-navy)'],
    ['scholar', 'GScholar', 'dp-dot-scholar', 'var(--dp-scholar)'],
    ['wos', 'WOS', 'dp-dot-wos', 'var(--dp-ink-3)']
  ];

  fetch(BASE + '/' + encodeURIComponent(SLUG) + '.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(render)
    .catch(function (e) {
      akar.innerHTML = '<div class="dp-error">Data publikasi belum tersedia. (' + esc(e.message) + ')</div>';
    });

  function lencana(p) {
    if (p.kuartil) return { teks: p.kuartil, kelas: 'dp-tag-q' };
    if (p.akreditasi && !/unknown/i.test(p.akreditasi))
      return { teks: p.akreditasi, kelas: 'dp-tag-q' };
    if (p.jenis_paten) return { teks: p.jenis_paten, kelas: 'dp-tag-alt' };
    if (p.dana) return { teks: p.dana, kelas: 'dp-tag-alt' };
    if (p.isbn) return { teks: 'ISBN ' + p.isbn, kelas: '' };
    return null;
  }

  function render(d) {
    var m = d.metrik || {}, sk = d.skor || {}, t = d.tautan || {}, h = [];

    // ---------- skor SINTA ----------
    if (mau('skor')) {
      var skor = [];
      if (sk.overall != null) skor.push([num(sk.overall), 'Skor SINTA keseluruhan', true]);
      if (sk.tiga_tahun != null) skor.push([num(sk.tiga_tahun), 'Skor SINTA 3 tahun terakhir']);
      if (sk.afiliasi != null) skor.push([num(sk.afiliasi), 'Skor afiliasi']);
      if (sk.afiliasi_tiga_tahun != null) skor.push([num(sk.afiliasi_tiga_tahun), 'Skor afiliasi 3 tahun']);
      if (skor.length) {
        h.push('<div class="dp-blok"><h3 class="dp-judul">Skor SINTA</h3><div class="dp-skor">' +
          skor.map(function (s) {
            return '<div class="dp-skor-item' + (s[2] ? ' utama' : '') + '">' +
              '<div class="dp-skor-angka">' + s[0] + '</div>' +
              '<div class="dp-skor-label">' + s[1] + '</div></div>';
          }).join('') + '</div></div>');
      }
    }

    // ---------- tabel metrik ----------
    if (mau('metrik')) {
      var adaSumber = SUMBER.filter(function (s) { return m[s[0]] && Object.keys(m[s[0]]).length; });
      if (adaSumber.length) {
        h.push('<div class="dp-blok"><h3 class="dp-judul">Metrik sitasi</h3>' +
          '<div class="dp-legenda">' + adaSumber.map(function (s) {
            return '<span><i class="dp-dot ' + s[2] + '"></i>' + s[1] + '</span>';
          }).join('') + '</div><div class="dp-metrik">' +
          BARIS.map(function (b) {
            var nilai = adaSumber.map(function (s) { return (m[s[0]] || {})[b[0]]; });
            if (!nilai.some(function (v) { return v != null; })) return '';
            var maks = Math.max.apply(null, nilai.map(function (v) { return v || 0; })) || 1;
            return '<div><div class="dp-baris-nama">' + b[1] + '</div>' +
              adaSumber.map(function (s, i) {
                var v = nilai[i];
                return '<div class="dp-bar-baris"><span class="dp-bar-sumber">' + s[1] + '</span>' +
                  '<span class="dp-bar-jalur"><span class="dp-bar-isi" style="width:' +
                  ((v || 0) / maks * 100).toFixed(1) + '%;background:' + s[3] + '"></span></span>' +
                  '<span class="dp-bar-nilai">' + num(v) + '</span></div>';
              }).join('') + '</div>';
          }).join('') + '</div></div>');
      }
    }

    // ---------- daftar publikasi terbaru ----------
    var pub = d.publikasi || [];
    if (mau('publikasi') && pub.length) {
      var perSumber = {};
      pub.forEach(function (p) { (perSumber[p.sumber] = perSumber[p.sumber] || []).push(p); });

      var isi = URUT.filter(function (k) { return perSumber[k] && perSumber[k].length; })
        .map(function (k) {
          var daftar = perSumber[k].slice().sort(function (a, b) {
            return (b.tahun || 0) - (a.tahun || 0) || (b.sitasi || 0) - (a.sitasi || 0);
          });
          return '<div class="dp-kat"><span class="dp-kat-nama">' + esc(NAMA_KATEGORI[k] || k) + '</span>' +
            '<span class="dp-kat-n">' + daftar.length + ' terbaru</span></div>' +
            daftar.map(kartuPub).join('');
        }).join('');

      h.push('<div class="dp-blok"><h3 class="dp-judul">Luaran terbaru</h3>' + isi +
        catatanBatas(d) + '</div>');
    }

    var tautan = [];
    if (t.sinta) tautan.push('<a href="' + esc(t.sinta) + '" target="_blank" rel="noopener">Profil SINTA ↗</a>');
    if (t.scholar) tautan.push('<a href="' + esc(t.scholar) + '" target="_blank" rel="noopener">Google Scholar ↗</a>');
    if (t.scopus) tautan.push('<a href="' + esc(t.scopus) + '" target="_blank" rel="noopener">Scopus ↗</a>');
    h.push('<div class="dp-kaki"><span>' + tautan.join(' · ') + '</span>' +
      '<span>Diperbarui otomatis dari SINTA · ' + esc((d.diperbarui || '').slice(0, 10)) + '</span></div>');

    akar.innerHTML = h.join('');
  }

  function kartuPub(p) {
    var l = lencana(p);
    return '<div class="dp-pub"><p class="dp-pub-judul">' +
      (p.url ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener">' + esc(p.judul) + '</a>'
             : esc(p.judul)) +
      '</p><div class="dp-pub-meta">' +
      (p.venue ? '<span>' + esc(p.venue) + '</span>' : '') +
      (p.tahun ? '<span class="dp-tag">' + p.tahun + '</span>' : '') +
      (l ? '<span class="dp-tag ' + l.kelas + '">' + esc(l.teks) + '</span>' : '') +
      (p.urutan_penulis ? '<span>penulis ke-' + esc(p.urutan_penulis) + '</span>' : '') +
      (p.sitasi ? '<span>' + num(p.sitasi) + ' sitasi</span>' : '') +
      '</div></div>';
  }

  function catatanBatas(d) {
    var b = d.batas_daftar;
    if (!b || b.lengkap) return '';
    var t = (d.tautan || {}).sinta;
    return '<div class="dp-catatan">Angka statistik di atas mencakup seluruh karier. ' +
      'Daftar di bagian ini hanya memuat ' + b.per_kategori + ' luaran terbaru per kategori, ' +
      'karena itu batas yang ditampilkan SINTA bagi pengunjung umum' +
      (t ? ' — daftar lengkap ada di <a href="' + esc(t) + '" target="_blank" rel="noopener">profil SINTA</a>' : '') +
      '.</div>';
  }
})();
</script>
