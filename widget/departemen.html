<!-- =========================================================================
     WIDGET PUBLIKASI & PPM DEPARTEMEN — halaman /publikasi/
     Tempel ke Elementor > widget "HTML".

       data-base   : URL folder data di GitHub Pages
       data-profil : pola URL halaman profil dosen; {slug} diganti otomatis.
                     kosongkan kalau nama dosen tidak perlu jadi tautan.

     Konsep sama dengan widget profil dosen: statistik yang ditampilkan hanya
     yang akurat (jumlah dosen, sitasi & h-index dari tabel metrik SINTA tiap
     dosen), lalu daftar luaran terbaru per tahun. Tanpa pencarian dan filter,
     karena SINTA hanya memberi 10 entri terbaru per kategori tanpa login.
     Angka turunan dari daftar itu (tren tahunan, komposisi) sengaja tidak
     ditampilkan karena bias ke tahun terbaru.
     ========================================================================= -->

<div class="dtntf-dep"
     data-base="https://NAMA-AKUN.github.io/dtntf-profil/data"
     data-profil="/dosen/{slug}/">
  <div class="dd-loading">Memuat data publikasi departemen…</div>
</div>

<style>
.dtntf-dep{
  --dd-navy:#073C64; --dd-navy-2:#1A2C43; --dd-ink:#0B0B16;
  --dd-ink-2:#4a5264; --dd-ink-3:#858c9c;
  --dd-surface:#fff; --dd-surface-2:#F7F7FB; --dd-line:#e3e4ec;
  --dd-lime:#C8E86D; --dd-navy-soft:#e8eef4; --dd-radius:10px;
  font-family:'Plus Jakarta Sans','Jakarta Sans',inherit,system-ui,sans-serif;
  color:var(--dd-ink); line-height:1.55; max-width:1140px; margin:0 auto;
}
.dtntf-dep *{box-sizing:border-box}
.dtntf-dep .dd-loading,.dtntf-dep .dd-error{padding:28px;text-align:center;color:var(--dd-ink-2);
  background:var(--dd-surface-2);border-radius:var(--dd-radius)}
.dtntf-dep .dd-error{color:#8a2b2b;background:#fdf1f1}

.dtntf-dep .dd-judul{font-size:.76rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--dd-navy-2);margin:0 0 15px;padding-bottom:9px;position:relative;border-bottom:1px solid var(--dd-line)}
.dtntf-dep .dd-judul::after{content:"";position:absolute;left:0;bottom:-1px;width:44px;height:3px;background:var(--dd-lime)}
.dtntf-dep .dd-blok{margin-bottom:36px}

/* statistik */
.dtntf-dep .dd-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(134px,1fr));gap:11px}
.dtntf-dep .dd-stat{background:var(--dd-surface-2);border-radius:var(--dd-radius);padding:16px 18px}
.dtntf-dep .dd-stat-angka{font-size:1.85rem;font-weight:700;line-height:1.1;
  font-variant-numeric:tabular-nums;color:var(--dd-navy)}
.dtntf-dep .dd-stat-label{font-size:.77rem;color:var(--dd-ink-2);margin-top:4px;font-weight:500}

/* daftar dosen */
.dtntf-dep .dd-dosen{display:flex;flex-direction:column}
.dtntf-dep .dd-dosen-baris{display:grid;grid-template-columns:1fr repeat(3,84px);gap:10px;align-items:baseline;
  padding:10px 0;border-bottom:1px solid var(--dd-line);font-size:.88rem}
.dtntf-dep .dd-dosen-kepala{white-space:nowrap;font-size:.72rem;font-weight:600;color:var(--dd-ink-3);padding-top:0}
.dtntf-dep .dd-dosen-baris span:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}
.dtntf-dep .dd-dosen-nama{font-weight:600;color:var(--dd-navy-2)}
.dtntf-dep .dd-dosen-nama a{color:inherit;text-decoration:none}
.dtntf-dep .dd-dosen-nama a:hover{text-decoration:underline}

/* daftar per tahun */
.dtntf-dep .dd-tahun{margin-bottom:30px}
.dtntf-dep .dd-tahun-kepala{display:flex;align-items:baseline;gap:12px;margin-bottom:4px;
  padding-bottom:8px;border-bottom:2px solid var(--dd-navy)}
.dtntf-dep .dd-tahun-angka{font-size:1.45rem;font-weight:700;color:var(--dd-navy);line-height:1.2}
.dtntf-dep .dd-tahun-n{font-size:.78rem;color:var(--dd-ink-3)}
.dtntf-dep .dd-kat{font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--dd-ink-2);margin:20px 0 8px}
.dtntf-dep .dd-entri{padding:9px 0 9px 14px;border-left:2px solid var(--dd-line);margin-bottom:2px;font-size:.89rem;line-height:1.5}
.dtntf-dep .dd-entri:hover{border-left-color:var(--dd-lime);background:var(--dd-surface-2)}
.dtntf-dep .dd-nama{font-weight:600;color:var(--dd-navy-2)}
.dtntf-dep .dd-nama a{color:inherit;text-decoration:none}
.dtntf-dep .dd-nama a:hover{text-decoration:underline}
.dtntf-dep .dd-entri-judul{color:var(--dd-ink)}
.dtntf-dep .dd-entri-judul a{color:inherit;text-decoration:none}
.dtntf-dep .dd-entri-judul a:hover{color:var(--dd-navy);text-decoration:underline}
.dtntf-dep .dd-entri-venue{font-style:italic;color:var(--dd-ink-2)}
.dtntf-dep .dd-meta{font-size:.76rem;color:var(--dd-ink-3);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dtntf-dep .dd-tag{background:var(--dd-surface-2);border-radius:4px;padding:1px 7px}
.dtntf-dep .dd-tag-q{background:var(--dd-navy-soft);color:var(--dd-navy);font-weight:600}
.dtntf-dep .dd-tag-alt{background:#f1f6e2;color:#4a6115;font-weight:600}

.dtntf-dep .dd-kaki{font-size:.73rem;color:var(--dd-ink-3);margin-top:24px;text-align:right}
.dtntf-dep .dd-catatan{font-size:.78rem;color:var(--dd-ink-2);background:var(--dd-surface-2);
  border-left:3px solid var(--dd-lime);border-radius:0 8px 8px 0;padding:10px 14px;margin:16px 0}
.dtntf-dep .dd-catatan a{color:var(--dd-navy)}

@media (max-width:600px){
  .dtntf-dep .dd-stat-angka{font-size:1.45rem}
  .dtntf-dep .dd-stats{grid-template-columns:repeat(2,1fr)}
  .dtntf-dep .dd-stat:first-child{grid-column:1/-1}
  .dtntf-dep .dd-dosen-baris{grid-template-columns:1fr 56px 46px 58px;gap:6px;font-size:.8rem}
}
</style>

<script>
(function () {
  var akar = document.currentScript.parentNode.querySelector('.dtntf-dep')
          || document.querySelector('.dtntf-dep:not([data-dd-siap])');
  if (!akar || akar.dataset.ddSiap) return;
  akar.dataset.ddSiap = '1';

  var BASE = (akar.dataset.base || '').replace(/\/$/, '');
  var POLA = akar.dataset.profil || '';

  var esc = function (s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var num = function (n) { return (n == null) ? '–' : Number(n).toLocaleString('id-ID'); };
  var tautanDosen = function (x) {
    return POLA ? '<a href="' + esc(POLA.replace('{slug}', x.slug)) + '">' + esc(x.nama) + '</a>' : esc(x.nama);
  };

  fetch(BASE + '/agregat/ringkas.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (d) {
      // Berkas per tahun kecil; unduh semuanya sekaligus.
      return Promise.all(d.per_tahun.map(function (t) {
        return fetch(BASE + '/agregat/' + t.berkas + '.json', { cache: 'no-cache' })
          .then(function (r) { return r.ok ? r.json() : { entri: [] }; })
          .then(function (x) { return { tahun: t.tahun, entri: x.entri || [] }; });
      })).then(function (tahun) { render(d, tahun); });
    })
    .catch(function (e) {
      akar.innerHTML = '<div class="dd-error">Data publikasi belum tersedia. (' + esc(e.message) + ')</div>';
    });

  function lencana(p) {
    if (p.kuartil) return { teks: p.kuartil, kelas: 'dd-tag-q' };
    if (p.akreditasi && !/unknown/i.test(p.akreditasi))
      return { teks: p.akreditasi, kelas: 'dd-tag-q' };
    if (p.jenis_paten) return { teks: p.jenis_paten, kelas: 'dd-tag-alt' };
    if (p.dana) return { teks: p.dana, kelas: 'dd-tag-alt' };
    if (p.isbn) return { teks: 'ISBN ' + p.isbn, kelas: '' };
    return null;
  }

  function entriHTML(e) {
    var l = lencana(e);
    var judul = e.url
      ? '<a href="' + esc(e.url) + '" target="_blank" rel="noopener">' + esc(e.judul) + '</a>'
      : esc(e.judul);
    return '<div class="dd-entri"><span class="dd-nama">' + e.dosen.map(tautanDosen).join(', ') + '</span>. ' +
      '<span class="dd-entri-judul">"' + judul + '"</span>' +
      (e.venue ? ' <span class="dd-entri-venue">' + esc(e.venue) + '</span>' : '') +
      (e.tahun ? ', ' + e.tahun : '') + '.' +
      '<div class="dd-meta">' +
      (l ? '<span class="dd-tag ' + l.kelas + '">' + esc(l.teks) + '</span>' : '') +
      (e.sitasi ? '<span>' + num(e.sitasi) + ' sitasi</span>' : '') +
      (e.dosen.length > 1 ? '<span>' + e.dosen.length + ' dosen DTNTF</span>' : '') +
      '</div></div>';
  }

  function render(d, tahun) {
    var dosen = d.dosen || [], h = [];
    var jumlah = function (k) {
      return dosen.reduce(function (a, x) { return a + (x[k] || 0); }, 0);
    };
    var hMaks = dosen.reduce(function (a, x) { return Math.max(a, x.hindex_scopus || 0); }, 0);

    // Semua angka di sini datang dari metrik SINTA tiap dosen (seumur karier),
    // bukan dari daftar 10 entri, jadi aman ditampilkan.
    h.push('<div class="dd-blok"><h3 class="dd-judul">Rekam jejak departemen</h3><div class="dd-stats">' +
      [[num(d.jumlah_dosen != null ? d.jumlah_dosen : dosen.length), 'Dosen'],
       [num(jumlah('sitasi_scopus')), 'Sitasi Scopus (jumlah profil dosen)'],
       [num(hMaks), 'h-index Scopus tertinggi']].map(function (k) {
        return '<div class="dd-stat"><div class="dd-stat-angka">' + k[0] + '</div>' +
               '<div class="dd-stat-label">' + k[1] + '</div></div>';
      }).join('') + '</div></div>');

    if (dosen.length) {
      var urut = dosen.slice().sort(function (a, b) { return (b.skor_sinta || 0) - (a.skor_sinta || 0); });
      h.push('<div class="dd-blok"><h3 class="dd-judul">Dosen</h3><div class="dd-dosen">' +
        '<div class="dd-dosen-baris dd-dosen-kepala"><span>Nama</span><span>Skor</span>' +
        '<span>Sitasi</span><span>h-index</span></div>' +
        urut.map(function (x) {
          return '<div class="dd-dosen-baris"><span class="dd-dosen-nama">' + tautanDosen(x) + '</span>' +
            '<span>' + num(x.skor_sinta) + '</span><span>' + num(x.sitasi_scopus) + '</span>' +
            '<span>' + num(x.hindex_scopus) + '</span></div>';
        }).join('') + '</div></div>');
    }

    var blok = tahun.filter(function (t) { return t.entri.length; }).map(function (t) {
      var perKat = {}, urutKat = [];
      t.entri.forEach(function (e) {
        if (!perKat[e.kategori]) { perKat[e.kategori] = []; urutKat.push(e.kategori); }
        perKat[e.kategori].push(e);
      });
      return '<div class="dd-tahun"><div class="dd-tahun-kepala">' +
        '<span class="dd-tahun-angka">' + (t.tahun || 'Tanpa tahun') + '</span>' +
        '<span class="dd-tahun-n">' + t.entri.length + ' luaran</span></div>' +
        urutKat.map(function (k) {
          return '<div class="dd-kat">' + esc(k) + '</div>' + perKat[k].map(entriHTML).join('');
        }).join('') + '</div>';
    }).join('');

    h.push('<div class="dd-blok"><h3 class="dd-judul">Luaran terbaru per tahun</h3>' +
      '<div class="dd-catatan">Angka statistik di atas mencakup seluruh karier. Daftar di bawah diambil ' +
      'otomatis dari profil SINTA tiap dosen, yang hanya menampilkan 10 entri terbaru per kategori ' +
      'bagi pengunjung umum, sehingga karya lama belum seluruhnya tercakup. Entri jurnal nasional ' +
      'berasal dari indeks Garuda yang dicocokkan SINTA berdasarkan nama penulis.</div>' +
      (blok || '<p style="color:var(--dd-ink-2)">Belum ada luaran.</p>') + '</div>');

    h.push('<div class="dd-kaki">Diperbarui otomatis dari SINTA · ' + esc(d.diperbarui || '') + '</div>');
    akar.innerHTML = h.join('');
  }
})();
</script>
