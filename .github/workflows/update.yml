name: Perbarui data publikasi

# GitHub TIDAK scrape SINTA (server GitHub diblokir SINTA). Scrape hanya dari komputer
# lokal ber-IP Indonesia: klik "Perbarui Data SINTA.command" (scripts/perbarui_lokal.py).
# Workflow ini hanya memasang data manual, membangun ulang agregat, dan menerbitkan
# GitHub Pages — jalan otomatis saat widget/skrip/daftar dosen berubah, atau lewat
# tombol Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dosen.csv"
      - "scripts/**"
      - "widget/**"
      - "manual/dosen-info.csv"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pasang luaran manual (jika ada) dan bangun ulang agregat dari data/*.json.
      - name: Pasang data manual & bangun agregat
        run: python scripts/manual.py

      - name: Simpan hasil ke repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git add data/
            git commit -m "Bangun ulang agregat $(date -u '+%Y-%m-%d')"
            git push
          else
            echo "tidak ada perubahan"
          fi

      - name: Siapkan folder publish
        run: |
          mkdir -p _site/data
          cp -r data/. _site/data/
          echo '{"ok":true}' > _site/health.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
