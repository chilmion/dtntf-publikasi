name: Perbarui data manual

# Jalan cepat (tanpa scrape SINTA): hanya memasang isi manual/luaran.xlsx
# ke data dosen lalu menerbitkan ulang. Dipicu otomatis saat berkas itu
# diunggah (mis. lewat scripts/unggah_manual.py), atau lewat tombol Run workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "manual/luaran.xlsx"
      - "manual/luaran.csv"
      - "scripts/manual.py"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang data manual
        run: python scripts/manual.py

      - name: Simpan hasil ke repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git add data/
            git commit -m "Perbarui data manual $(date -u '+%Y-%m-%d')"
            git push
          else
            echo "tidak ada perubahan"
          fi

      - name: Siapkan folder publish
        run: |
          mkdir -p _site/data
          cp -r data/. _site/data/
          echo '{"ok":true}' > _site/health.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
